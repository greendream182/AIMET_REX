[pytest]
markers =
    slow: long-running PTQ/AdaRound or full-model tests (deselect with `-m "not slow"`)
    imagenet: requires local ImageNet val set (AIMET_RX_IMAGENET_VAL); deselect with `-m "not imagenet"`
    golden: loads committed npz reference under tests/fixed_point/data/
    gpu: requires CUDA (optional; deselect with `-m "not gpu"`)
